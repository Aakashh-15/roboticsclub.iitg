name: Check & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done
      - name: Validate site content (content/*.json)
        run: node scripts/validate.mjs

  deploy:
    # Deploying is paused: pushes only run the checks above.
    # To publish, open Actions → "Check & deploy" → "Run workflow" (branch: main).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html projects.html project.html achievements.html \
                team.html gallery.html resources.html 404.html robots.txt .nojekyll \
                css js fonts images materials content admin _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          # cache-busting: append the commit id to css/js links so browsers fetch the new versions
          v=${GITHUB_SHA::8}
          sed -i -E "s#(href=\"(\.\./)?css/[a-z-]+\.css)\"#\1?v=$v\"#g; s#(src=\"js/[a-z-]+\.js)\"#\1?v=$v\"#g" _site/*.html _site/admin/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
